name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # torch is deliberately NOT installed: the unit tests use a fake
      # model, and the torch-dependent tests skip themselves.
      - name: Install light dependencies
        run: pip install pydantic numpy tqdm pytest pytest-cov flake8 mypy
      - name: Lint
        run: |
          flake8 .
          mypy src benchmarks --warn-return-any --warn-unused-ignores \
            --ignore-missing-imports --disallow-untyped-defs \
            --check-untyped-defs
      - name: Unit tests
        run: pytest --cov --cov-report=term-missing

  torch-tests:
    # Exercises the KV-cache wrapper against a tiny random Qwen3 model
    # (no weights downloaded), using CPU-only torch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch + deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5" accelerate huggingface-hub \
            pydantic numpy tqdm pytest
      - run: pytest tests/test_kvcache.py
