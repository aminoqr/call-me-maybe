[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding for reliable function calling with a 0.6B LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.60.0",
    "accelerate>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "llm_sdk"]

[tool.mypy]
exclude = ["llm_sdk", "\\.venv"]

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "pydantic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.models"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -q"
markers = [
    "slow: loads the real Qwen3-0.6B model (run with `make test-slow`)",
]

[tool.coverage.run]
source = ["src", "benchmarks"]
omit = ["src/__main__.py"]
